plugins { id 'com.android.application' }

android {
    namespace 'id.web.borneomarketplace'
    compileSdk { version = release(36) { minorApiLevel = 1 } }
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId 'id.web.borneomarketplace'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
    }
    signingConfigs {
        release {
            def path = System.getenv('BORNEO_ANDROID_SIGNING_PROPERTIES')
            if (path) {
                def credentials = new Properties()
                file(path).withInputStream { credentials.load(it) }
                storeFile file(credentials['storeFile'])
                storePassword credentials['storePassword']
                keyAlias credentials['keyAlias']
                keyPassword credentials['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.activity:activity:1.12.4' }
